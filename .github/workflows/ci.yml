name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:production-build
      - run: npm run test:mcp-package

  evaluation:
    name: Evaluation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval
      - run: npm run eval:product-ab

  browser:
    name: Browser / React compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix test-sites/lumina-atelier
      - run: npm ci --prefix test-sites/modern-tailwind-v4
      - run: npm run test:compat-modern
      - run: npm run test:e2e:install -- --with-deps
      - run: npm run test:e2e
      - run: npm run test:compat-pnpm
